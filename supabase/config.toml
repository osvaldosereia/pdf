# Configuração explícita de autenticação das Edge Functions Dona Antônia.
# Mantém o comportamento já implantado e evita alterações acidentais em deploys futuros.

[functions.whatsapp-ingest]
verify_jwt = false

# Adaptador fino para o HTTP v4 do Make. Ele apenas converte form fields em JSON e
# encaminha a mesma chave custom para whatsapp-ingest, que faz a validação real.
[functions.whatsapp-ingest-make-v1]
verify_jwt = false

# Server-to-server Make -> Supabase. JWT gateway desligado somente porque a função
# valida x-da-ingest-key contra hash server-only em system_secrets.
[functions.whatsapp-outbound-v1]
verify_jwt = false

# Worker event-driven interno. JWT gateway desligado porque aceita apenas a chave
# gerada server-side no Vault e validada contra hash em system_secrets.
[functions.conversation-worker-v2]
verify_jwt = false

[functions.bling-products-ingest]
verify_jwt = false

[functions.bling-products-import-once]
verify_jwt = false

[functions.inventory-count-v2]
verify_jwt = true

[functions.admin-ops-v1]
verify_jwt = true

# Observabilidade/fallback do WhatsApp: JWT + getUser + admin_users.
[functions.admin-whatsapp-ops-v1]
verify_jwt = true

# Orquestrador administrativo: endpoint autenticado e autorizado internamente.
[functions.admin-experience-orchestrator-v1]
verify_jwt = true

# Administração de chaves/readiness do Flow: JWT obrigatório + autorização owner no handler.
[functions.admin-whatsapp-flow-v1]
verify_jwt = true

# Callback de Data Exchange da Meta. A Meta não envia JWT do Supabase; por isso o gateway
# JWT fica desligado exclusivamente aqui. O endpoint continua fail-closed por criptografia
# do protocolo, gates no banco, token de sessão, replay guard, state machine e budget.
[functions.whatsapp-flow-data-exchange-v1]
verify_jwt = false

# Webhook oficial do Instagram. A Meta não envia JWT do Supabase. Quando futuramente
# implantado, este endpoint só aceita POST com x-hub-signature-256 HMAC-SHA256 válido
# usando META_APP_SECRET e só processa contas Instagram já cadastradas e gateadas no banco.
# Nesta etapa a função permanece apenas versionada: nenhuma subscription Meta é criada.
[functions.instagram-webhook-v1]
verify_jwt = false

[functions.bootstrap-owner-v1]
verify_jwt = true

[functions.admin-baskets-v1]
verify_jwt = true

[functions.mini-catalog-v1]
verify_jwt = false

[functions.customer-intelligence-v1]
verify_jwt = true

[functions.shopping-room-v1]
verify_jwt = false

[functions.shopping-room-sales-v1]
verify_jwt = false
