<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>Dona Antônia · Operações</title></head><body><main id="app"><section class="screen"><header><div><strong>Dona Antônia</strong><span>Operações · Fulfillment</span></div><button id="refreshBtn" class="ghost">Atualizar</button></header><div id="gate" class="card warning">Aplicativo dormente.</div><div id="me" class="card hidden"></div><div class="tabs hidden" id="tabs"><button data-tab="queue" class="active">Fila</button><button data-tab="work">Pedido</button></div><section id="queueView" class="hidden"><div id="queue"></div></section><section id="workView" class="hidden"><div id="orderHeader" class="card"></div><div id="nextTask" class="card"></div><form id="scanForm" class="scanbox"><label for="barcode">Código de barras</label><input id="barcode" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escaneie o produto"><div class="row"><input id="qty" type="number" min="0.001" step="0.001" value="1"><button type="submit">Confirmar leitura</button></div></form><div class="row actions"><button id="startBtn">Iniciar separação</button><button id="completeBtn">Concluir etapa</button></div><div id="tasks"></div><div id="exceptions"></div></section><div id="toast" role="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script></body></html>
