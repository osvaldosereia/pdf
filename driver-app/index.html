<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f2a"><meta name="robots" content="noindex,nofollow">
<title>Dona Antônia · Entregas</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="disabledView" class="shell disabled"><div class="card"><div class="badge">DA</div><h1>App do Entregador</h1><p>Módulo preparado, porém ainda não liberado para operação real.</p><small>Etapa 11 · runtime logístico OFF</small></div></div>
<div id="app" class="shell hidden">
<header><div><strong>Dona Antônia</strong><small id="driverName">Entregador</small></div><div id="networkState" class="pill">online</div></header>
<main>
<section id="loginPanel" class="card"><h1>Entrar</h1><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">Entrar</button><div id="loginStatus" class="status"></div></section>
<section id="routePanel" class="hidden"><div class="card route-head"><div><span class="eyebrow">Rota atual</span><h1 id="routeCode">—</h1><p id="routeSummary">Sem rota carregada.</p></div><button id="startRouteBtn" class="primary hidden">Começar rota</button></div><div id="stops"></div></section>
</main>
<footer id="syncFooter" class="hidden"><span id="queueCount">0 pendências offline</span><button id="syncBtn">Sincronizar</button></footer>
</div>
<script src="./config.js"></script><script type="module" src="./app.js"></script>
</body></html>
