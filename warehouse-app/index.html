<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dona Antônia · Operação</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#111}main{max-width:720px;margin:auto;padding:12px 12px 90px}.card{background:#fff;border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 8px #0001}.muted{color:#666}.big{font-size:1.35rem;font-weight:700}.scan{width:100%;font-size:1.35rem;padding:14px;border:2px solid #222;border-radius:12px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eee;border-radius:999px;padding:8px 12px}.ok{font-weight:700;color:#176c34}.bad{font-weight:700;color:#a32323}.hidden{display:none!important}button{font-size:1rem;padding:12px 14px;border:0;border-radius:12px;background:#111;color:#fff}.queueItem{width:100%;display:flex;justify-content:space-between;margin:6px 0;background:#fff;color:#111;border:1px solid #ddd}.tabs button{flex:1}.tabs .inactive{background:#ddd;color:#222}.task{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.task div{display:flex;flex-direction:column}.warning{background:#fff8dd}.exception{background:#fff0f0;border:1px solid #e5b5b5}</style></head><body><main><section class="card"><div class="big">Operação Dona Antônia</div><div id="mode" class="muted">módulo desligado</div><div id="staff" class="muted"></div></section><section id="app" class="hidden"><div class="row tabs"><button id="queueTab">Fila</button><button id="workTab" class="inactive">Pedido</button></div><section id="queueView"><section class="card"><div class="big">Pedidos disponíveis</div><div id="queue"></div></section></section><section id="workView" class="hidden"><section class="card"><div id="orderTitle" class="big">Pedido</div><div class="row"><span id="phase" class="pill">separação</span><span id="progress" class="pill">0/0</span></div></section><section class="card"><div class="muted">Próximo produto</div><div id="productName" class="big">—</div><div id="location">—</div><div id="lot" class="muted"></div><div id="qty" class="big">0 / 0</div></section><section class="card"><label class="muted" for="barcode">Código de barras</label><input id="barcode" class="scan" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escaneie o produto"><div class="row"><label>Qtd. <input id="scanQty" type="number" min="0.001" step="0.001" value="1" style="width:80px;padding:10px"></label></div><div id="feedback" class="muted"></div></section><section class="card"><div class="row"><button id="startPicking">Iniciar separação</button><button id="finish">Finalizar etapa</button></div></section><section id="tasks" class="card"></section><section id="exceptions"></section></section></section><section id="gate" class="card warning">Módulo WMS desligado.</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./app.js"></script></body></html>
