<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dona Antônia · Operação</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#111}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 8px #0001}.muted{color:#666}.big{font-size:1.35rem;font-weight:700}.scan{width:100%;font-size:1.2rem;padding:14px;border:1px solid #bbb;border-radius:12px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eee;border-radius:999px;padding:8px 12px}.ok{font-weight:700}.hidden{display:none}button{font-size:1rem;padding:12px 14px;border:0;border-radius:12px}</style></head><body><main><section class="card"><div class="big">Operação Dona Antônia</div><div id="mode" class="muted">módulo desligado</div></section><section id="app" class="hidden"><section class="card"><div id="orderTitle" class="big">Pedido</div><div class="row"><span id="phase" class="pill">separação</span><span id="progress" class="pill">0/0</span></div></section><section class="card"><div class="muted">Próximo produto</div><div id="productName" class="big">—</div><div id="location">—</div><div id="lot" class="muted"></div><div id="qty" class="big">0 / 0</div></section><section class="card"><input id="barcode" class="scan" inputmode="numeric" autocomplete="off" placeholder="Escaneie o código de barras"><div id="feedback" class="muted"></div></section><section class="card"><button id="finish">Finalizar etapa</button></section></section></main><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
