<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f2a">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Dona Antônia · Catálogo</title>
  <link rel="stylesheet" href="./style.css?v=20260909-02">
</head>
<body>
  <header class="top">
    <div class="brand"><span>DA</span><div><strong>Dona Antônia</strong><small>Escolha os produtos e continue no WhatsApp</small></div></div>
    <div id="countBadge" class="badge">0 itens</div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Vitrine Dona Antônia</div>
      <h1 id="catalogTitle">Carregando...</h1>
      <p id="catalogSubtitle">Adicione os produtos que quiser ao seu pedido.</p>
      <div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Buscar produto"></div>
    </section>

    <section id="stateBox" class="state">Carregando produtos...</section>
    <section id="productGrid" class="grid hidden"></section>
  </main>

  <footer id="stickyBar" class="sticky hidden">
    <div><small>Seu pedido</small><strong id="selectedTotal">R$ 0,00</strong><span id="selectedCount">0 itens</span></div>
    <button id="whatsappButton" type="button">Continuar no WhatsApp</button>
  </footer>

  <template id="productTemplate">
    <article class="product">
      <div class="image-wrap"><img class="product-image" alt=""></div>
      <div class="product-info">
        <div class="product-top"><div><h2 class="product-name"></h2><p class="product-meta"></p></div><strong class="product-price"></strong></div>
        <p class="product-reason"></p>
        <div class="qty-row"><button class="minus" type="button" aria-label="Diminuir">−</button><span class="qty">0</span><button class="plus" type="button" aria-label="Aumentar">+</button></div>
      </div>
    </article>
  </template>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="./config.js?v=20260909-02"></script>
  <script src="./app.js?v=20260909-02"></script>
</body>
</html>
