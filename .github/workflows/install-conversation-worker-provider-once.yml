name: Install conversation worker provider once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-conversation-worker-provider-once.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install OpenAI provider into Supabase Vault
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const {SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY}=process.env;
          if(!SUPABASE_URL||!SUPABASE_SERVICE_ROLE_KEY||!OPENAI_API_KEY) throw new Error('required_secret_missing');
          const base=new URL(SUPABASE_URL).origin;
          const headers={apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,'Content-Type':'application/json'};
          const install=await fetch(`${base}/rest/v1/rpc/install_conversation_worker_provider_secret_v1`,{method:'POST',headers,body:JSON.stringify({p_openai_api_key:OPENAI_API_KEY})});
          if(!install.ok){const detail=(await install.text()).slice(0,500);throw new Error(`provider_install_failed_${install.status}:${detail}`);}
          const health=await fetch(`${base}/rest/v1/rpc/get_conversation_worker_provider_health_v1`,{method:'POST',headers,body:'{}'});
          if(!health.ok){const detail=(await health.text()).slice(0,500);throw new Error(`provider_health_failed_${health.status}:${detail}`);}
          const result=await health.json();
          if(result?.configured!==true) throw new Error('provider_not_configured');
          console.log(JSON.stringify({ok:true,provider:result.provider,configured:true}));
          NODE
