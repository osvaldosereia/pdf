name: Dona Antonia - WhatsApp image live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conversation-worker-whatsapp-image-live-once.yml'

permissions:
  contents: read

concurrency:
  group: dona-antonia-conversation-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_JOB_ID: bda1dc33-94ab-4e0f-b2d4-79e87021cbf8
      EXPECTED_MESSAGE_ID: 71438d3e-c412-4407-ba85-23b85ed26f1f
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CONVERSATION_MODEL: ${{ vars.OPENAI_CONVERSATION_MODEL }}
      OPENAI_TRANSCRIPTION_MODEL: ${{ vars.OPENAI_TRANSCRIPTION_MODEL }}
      AI_JOB_LIMIT: '1'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify exact image job and private media before provider spend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,EXPECTED_JOB_ID,EXPECTED_MESSAGE_ID}=process.env;
          if(!SUPABASE_URL||!SUPABASE_SERVICE_ROLE_KEY||!EXPECTED_JOB_ID||!EXPECTED_MESSAGE_ID) throw new Error('missing_required_environment');
          const headers={apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`};
          const get=async path=>{const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers,signal:AbortSignal.timeout(20000),redirect:'error'});if(!r.ok)throw new Error(`preflight_http_${r.status}`);return r.json();};
          const jobs=await get('ai_jobs?status=eq.pending&select=id,message_id,job_type,status,attempts&order=created_at.asc');
          if(jobs.length!==1) throw new Error(`unexpected_pending_count_${jobs.length}`);
          const j=jobs[0];
          if(j.id!==EXPECTED_JOB_ID||j.message_id!==EXPECTED_MESSAGE_ID||j.job_type!=='vision'||j.attempts!==0) throw new Error('unexpected_image_job');
          const messages=await get(`messages?id=eq.${EXPECTED_MESSAGE_ID}&select=id,message_type,direction`);
          if(messages.length!==1||messages[0].message_type!=='image'||messages[0].direction!=='inbound') throw new Error('unexpected_image_message');
          const media=await get(`room_media?message_id=eq.${EXPECTED_MESSAGE_ID}&select=id,message_id,kind,mime_type,bytes,object_path,processing_status`);
          if(media.length!==1) throw new Error(`unexpected_media_count_${media.length}`);
          const m=media[0];
          if(m.kind!=='image'||m.mime_type!=='image/jpeg'||!(Number(m.bytes)>0&&Number(m.bytes)<=10485760)||!String(m.object_path||'').includes('/image/whatsapp/')) throw new Error('invalid_image_media');
          console.log(JSON.stringify({preflight:'ok',job_id:j.id,bytes:m.bytes,mime_type:m.mime_type}));
          NODE

      - name: Run worker tests
        run: node --test scripts/conversation-worker-v1.test.mjs scripts/audio-transcription-chain-v1.test.mjs scripts/whatsapp-bridge-v1.test.mjs scripts/whatsapp-outbound-receipt-v1.test.mjs

      - name: Process exactly one vision job
        run: node scripts/conversation-worker-v1.mjs --apply

      - name: Verify vision result and wait for Meta receipt
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,EXPECTED_JOB_ID,EXPECTED_MESSAGE_ID}=process.env;
          const headers={apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`};
          const get=async path=>{const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers,signal:AbortSignal.timeout(20000),redirect:'error'});if(!r.ok)throw new Error(`postflight_http_${r.status}`);return r.json();};
          const jobs=await get(`ai_jobs?id=eq.${EXPECTED_JOB_ID}&select=id,status,attempts,result,error_message`);
          if(jobs.length!==1||jobs[0].status!=='done'||jobs[0].attempts!==1) throw new Error('vision_job_not_done_once');
          const result=jobs[0].result||{};
          if(!String(result.reply||'').trim()||result.reply_suppressed===true||!result.outbound_job_id) throw new Error('vision_reply_missing');
          let outbound=null;
          for(let i=0;i<18;i++){
            const rows=await get(`outbound_jobs?id=eq.${result.outbound_job_id}&select=id,status,attempts,dispatch_attempts,provider_message_id,dispatch_response_status,last_error,payload`);
            outbound=rows[0]||null;
            if(outbound?.status==='sent'&&outbound.provider_message_id&&Number(outbound.dispatch_response_status)===200) break;
            await new Promise(r=>setTimeout(r,2500));
          }
          if(!outbound||outbound.status!=='sent'||!outbound.provider_message_id||Number(outbound.dispatch_response_status)!==200) throw new Error('meta_text_receipt_not_confirmed');
          if(outbound.payload?.delivery_mode!=='text') throw new Error('unexpected_image_reply_delivery_mode');
          const active=await get(`ai_jobs?message_id=eq.${EXPECTED_MESSAGE_ID}&status=in.(pending,processing)&select=id`);
          if(active.length) throw new Error(`active_ai_jobs_remaining_${active.length}`);
          console.log(JSON.stringify({postflight:'ok',job_id:jobs[0].id,intent:result.intent||null,outbound_job:outbound.id,delivery_mode:outbound.payload.delivery_mode}));
          NODE
