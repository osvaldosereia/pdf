name: Dona Antonia - WhatsApp audio AI live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conversation-worker-whatsapp-audio-live-once.yml'

permissions:
  contents: read

concurrency:
  group: dona-antonia-conversation-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_JOB_ID: b3d4a2e1-5831-45f3-a9e4-ab6402d5b038
      EXPECTED_MESSAGE_ID: abbb8676-b4da-4f9b-a432-4dfd588f19d8
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CONVERSATION_MODEL: ${{ vars.OPENAI_CONVERSATION_MODEL }}
      OPENAI_TRANSCRIPTION_MODEL: ${{ vars.OPENAI_TRANSCRIPTION_MODEL }}
      AI_JOB_LIMIT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify exact audio job and private media before provider spend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,EXPECTED_JOB_ID,EXPECTED_MESSAGE_ID}=process.env;
          if(!SUPABASE_URL||!SUPABASE_SERVICE_ROLE_KEY||!EXPECTED_JOB_ID||!EXPECTED_MESSAGE_ID) throw new Error('missing_required_environment');
          const headers={apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`};
          const j=await fetch(`${SUPABASE_URL}/rest/v1/ai_jobs?status=eq.pending&select=id,message_id,job_type,status&order=created_at.asc`,{headers,signal:AbortSignal.timeout(20000),redirect:'error'});
          if(!j.ok) throw new Error(`jobs_http_${j.status}`);
          const jobs=await j.json();
          if(jobs.length!==1) throw new Error(`unexpected_pending_count_${jobs.length}`);
          if(jobs[0].id!==EXPECTED_JOB_ID||jobs[0].message_id!==EXPECTED_MESSAGE_ID||jobs[0].job_type!=='transcription') throw new Error('unexpected_audio_job');
          const m=await fetch(`${SUPABASE_URL}/rest/v1/room_media?message_id=eq.${EXPECTED_MESSAGE_ID}&select=id,kind,mime_type,bytes,object_path,processing_status`,{headers,signal:AbortSignal.timeout(20000),redirect:'error'});
          if(!m.ok) throw new Error(`media_http_${m.status}`);
          const media=await m.json();
          if(media.length!==1) throw new Error(`unexpected_media_count_${media.length}`);
          const x=media[0];
          if(x.kind!=='audio'||x.mime_type!=='audio/ogg'||!(Number(x.bytes)>0&&Number(x.bytes)<=10485760)||!String(x.object_path||'').includes('/audio/whatsapp/')) throw new Error('invalid_audio_media');
          console.log(JSON.stringify({preflight:'ok',job_id:jobs[0].id,job_type:jobs[0].job_type,bytes:x.bytes,mime_type:x.mime_type}));
          NODE

      - name: Run worker tests
        run: node --test scripts/conversation-worker-v1.test.mjs scripts/whatsapp-bridge-v1.test.mjs scripts/whatsapp-outbound-receipt-v1.test.mjs

      - name: Process exactly one audio transcription job
        run: node scripts/conversation-worker-v1.mjs --apply

      - name: Verify exact audio job completed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,EXPECTED_JOB_ID}=process.env;
          const headers={apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`};
          const r=await fetch(`${SUPABASE_URL}/rest/v1/ai_jobs?id=eq.${EXPECTED_JOB_ID}&select=id,status,attempts,error_message,result`,{headers,signal:AbortSignal.timeout(20000),redirect:'error'});
          if(!r.ok) throw new Error(`postflight_http_${r.status}`);
          const jobs=await r.json();
          if(jobs.length!==1||jobs[0].status!=='done'||jobs[0].attempts!==1) throw new Error('expected_audio_job_not_done_once');
          if(!String(jobs[0].result?.transcript||'').trim()) throw new Error('missing_transcript');
          console.log(JSON.stringify({postflight:'ok',job_id:jobs[0].id,status:jobs[0].status,attempts:jobs[0].attempts,has_transcript:true}));
          NODE
