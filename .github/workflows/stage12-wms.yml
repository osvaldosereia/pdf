name: Stage 12 WMS

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260908130000_stage12_wms_foundation_v1.sql'
      - 'lib/fulfillment/**'
      - 'warehouse-app/**'
      - 'scripts/test-wms-stage12-v1.mjs'
      - 'scripts/test-wms-stage12-db-v1.mjs'
      - 'docs/ETAPA-12-WMS-FULFILLMENT-V1.md'
      - '.github/workflows/stage12-wms.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908130000_stage12_wms_foundation_v1.sql'
      - 'lib/fulfillment/**'
      - 'warehouse-app/**'
      - 'scripts/test-wms-stage12-v1.mjs'
      - 'scripts/test-wms-stage12-db-v1.mjs'
      - 'docs/ETAPA-12-WMS-FULFILLMENT-V1.md'
      - '.github/workflows/stage12-wms.yml'
permissions:
  contents: read
jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            supabase/migrations/20260908130000_stage12_wms_foundation_v1.sql
            lib/fulfillment/
            warehouse-app/
            scripts/test-wms-stage12-v1.mjs
            scripts/test-wms-stage12-db-v1.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/stage12" --no-save @electric-sql/pglite@0.5.8
      - name: Contratos WMS
        run: node scripts/test-wms-stage12-v1.mjs
      - name: Migration isolada
        env:
          TEST_RUNTIME: ${{ runner.temp }}/stage12
        run: node scripts/test-wms-stage12-db-v1.mjs
      - name: Sintaxe mobile
        run: |
          node --check lib/fulfillment/pick-plan-v1.mjs
          node --check warehouse-app/app.js
          node --check warehouse-app/sw.js
