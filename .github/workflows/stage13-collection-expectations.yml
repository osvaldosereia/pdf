name: Stage 13 Collection Expectations

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260908173000_stage13_collection_expectations_v1.sql'
      - 'supabase/migrations/20260908173100_stage13_collection_expectations_prepaid_fix_v2.sql'
      - 'scripts/test-stage13-collection-expectations-contract-v1.mjs'
      - 'scripts/test-stage13-collection-expectations-db-v1.mjs'
      - 'docs/ETAPA-13-COLLECTION-EXPECTATIONS-V1.md'
      - '.github/workflows/stage13-collection-expectations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908173000_stage13_collection_expectations_v1.sql'
      - 'supabase/migrations/20260908173100_stage13_collection_expectations_prepaid_fix_v2.sql'
      - 'scripts/test-stage13-collection-expectations-contract-v1.mjs'
      - 'scripts/test-stage13-collection-expectations-db-v1.mjs'
      - 'docs/ETAPA-13-COLLECTION-EXPECTATIONS-V1.md'
      - '.github/workflows/stage13-collection-expectations.yml'

permissions:
  contents: read

jobs:
  collection-expectations:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            supabase/migrations/20260908170000_stage13_financial_ledger_foundation_v1.sql
            supabase/migrations/20260908172000_stage13_financial_append_only_security_fix_v1.sql
            supabase/migrations/20260908173000_stage13_collection_expectations_v1.sql
            supabase/migrations/20260908173100_stage13_collection_expectations_prepaid_fix_v2.sql
            scripts/test-stage13-collection-expectations-contract-v1.mjs
            scripts/test-stage13-collection-expectations-db-v1.mjs
            docs/ETAPA-13-COLLECTION-EXPECTATIONS-V1.md
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/stage13-collection" --no-save @electric-sql/pglite@0.5.8
      - name: Contrato estático
        run: node scripts/test-stage13-collection-expectations-contract-v1.mjs
      - name: Expectativas e manifesto em PostgreSQL isolado
        env:
          TEST_RUNTIME: ${{ runner.temp }}/stage13-collection
        run: node scripts/test-stage13-collection-expectations-db-v1.mjs
