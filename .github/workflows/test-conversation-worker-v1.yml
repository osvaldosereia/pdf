name: Test Dona Antonia conversation worker
on:
  pull_request:
    paths: ['scripts/**conversation**', 'scripts/audio-transcription-chain-v1.test.mjs', 'scripts/whatsapp-bridge-v1.test.mjs', 'scripts/whatsapp-outbound-receipt-v1.test.mjs', 'scripts/whatsapp-operational-release-v1.test.mjs', 'scripts/whatsapp-live-canary-preflight-v1.test.mjs', 'scripts/lib/conversation-core-v1.mjs', 'scripts/fixtures/conversation-schema-v1.sql', 'scripts/test-shopping-room-dom-v1.mjs', 'scripts/test-shopping-room-sales-preview-v1.mjs', 'scripts/test-shopping-room-sales-complete-v1.mjs', 'supabase/migrations/**', 'supabase/functions/_shared/**', 'supabase/functions/conversation-worker-v2/**', 'supabase/functions/admin-whatsapp-ops-v1/**', 'supabase/functions/whatsapp-ingest/**', 'supabase/functions/whatsapp-ingest-make-v1/**', 'supabase/functions/whatsapp-outbound-v1/**', 'supabase/functions/shopping-room-v1/**', 'supabase/functions/shopping-room-sales-v1/**', 'supabase/functions/admin-ops-v1/**', 'comprar/**', 'admin/**', 'admin-v3/app.js', 'admin-v3/whatsapp-ops.js', 'admin-v3/whatsapp-ops.css', 'tests/conversation/**', '.github/workflows/test-conversation-worker-v1.yml']
  push:
    paths: ['scripts/**conversation**', 'scripts/audio-transcription-chain-v1.test.mjs', 'scripts/whatsapp-bridge-v1.test.mjs', 'scripts/whatsapp-outbound-receipt-v1.test.mjs', 'scripts/whatsapp-operational-release-v1.test.mjs', 'scripts/whatsapp-live-canary-preflight-v1.test.mjs', 'scripts/lib/conversation-core-v1.mjs', 'scripts/fixtures/conversation-schema-v1.sql', 'scripts/test-shopping-room-dom-v1.mjs', 'scripts/test-shopping-room-sales-preview-v1.mjs', 'scripts/test-shopping-room-sales-complete-v1.mjs', 'supabase/migrations/**', 'supabase/functions/_shared/**', 'supabase/functions/conversation-worker-v2/**', 'supabase/functions/admin-whatsapp-ops-v1/**', 'supabase/functions/whatsapp-ingest/**', 'supabase/functions/whatsapp-ingest-make-v1/**', 'supabase/functions/whatsapp-outbound-v1/**', 'supabase/functions/shopping-room-v1/**', 'supabase/functions/shopping-room-sales-v1/**', 'supabase/functions/admin-ops-v1/**', 'comprar/**', 'admin/**', 'admin-v3/app.js', 'admin-v3/whatsapp-ops.js', 'admin-v3/whatsapp-ops.css', 'tests/conversation/**', '.github/workflows/test-conversation-worker-v1.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_RUNTIME: ${{ github.workspace }}/tests/conversation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --prefix tests/conversation --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/conversation-worker-v1.test.mjs scripts/audio-transcription-chain-v1.test.mjs scripts/whatsapp-bridge-v1.test.mjs scripts/whatsapp-outbound-receipt-v1.test.mjs scripts/whatsapp-operational-release-v1.test.mjs scripts/whatsapp-live-canary-preflight-v1.test.mjs
      - run: node scripts/test-conversation-local-db-v1.mjs
      - run: node scripts/test-shopping-room-dom-v1.mjs
      - run: node scripts/test-shopping-room-sales-preview-v1.mjs
      - run: node scripts/test-shopping-room-sales-complete-v1.mjs
      - run: node --check comprar/app.js && node --check comprar/sales-intelligence.js && node --check admin-v3/app.js && node --check admin-v3/whatsapp-ops.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/conversation-worker-v2/index.ts supabase/functions/admin-whatsapp-ops-v1/index.ts supabase/functions/whatsapp-ingest/index.ts supabase/functions/whatsapp-ingest-make-v1/index.ts supabase/functions/whatsapp-outbound-v1/index.ts supabase/functions/shopping-room-v1/index.ts supabase/functions/shopping-room-sales-v1/index.ts supabase/functions/admin-ops-v1/index.ts
