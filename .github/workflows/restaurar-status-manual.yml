name: Preservar status manual dos produtos
run-name: Status manual · ${{ github.event_name }}

# Legado: mantido apenas para execução manual deliberada.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preservar-status-manual
  cancel-in-progress: true

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restaurar alterações manuais de status
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL || 'https://cedar-chemist-310801-default-rtdb.firebaseio.com' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: node scripts/restaurar-status-manual.mjs
