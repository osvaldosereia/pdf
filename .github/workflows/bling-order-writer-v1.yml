name: Dona Antônia · Pedidos → Bling
run-name: Pedidos → Bling · ${{ github.event_name == 'schedule' && 'lote automático' || inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de execução
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      limit:
        description: Máximo de pedidos por rodada
        required: true
        default: '10'
        type: string
  schedule:
    # Cuiabá = UTC-4. 11:00–21:50 UTC corresponde a 07:00–17:50 local.
    - cron: '*/10 11-21 * * *'
    # Última rodada do dia exatamente às 18:00 de Cuiabá.
    - cron: '0 22 * * *'

permissions:
  contents: read

concurrency:
  group: bling-api-global
  cancel-in-progress: false

jobs:
  pedidos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: scripts/bling-order-writer-v1.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validar sintaxe
        run: node --check scripts/bling-order-writer-v1.mjs
      - name: Confirmar janela operacional
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hhmm="$(TZ=America/Cuiaba date +%H%M)"
          if [ "$hhmm" -lt 0700 ] || [ "$hhmm" -gt 1800 ]; then
            echo "Fora da janela 07:00–18:00 de Cuiabá: $hhmm"
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Dentro da janela comercial de Cuiabá: $hhmm"
          echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Validar secrets
        if: steps.window.outputs.run == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          EFFECTIVE_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'Falta SUPABASE_SERVICE_ROLE_KEY' >&2; exit 1; }
          if [ "$EFFECTIVE_MODE" = "apply" ]; then
            test -n "$BLING_CLIENT_ID" || { echo 'Falta BLING_CLIENT_ID' >&2; exit 1; }
            test -n "$BLING_CLIENT_SECRET" || { echo 'Falta BLING_CLIENT_SECRET' >&2; exit 1; }
            test -n "$BLING_REFRESH_TOKEN" || { echo 'Falta BLING_REFRESH_TOKEN' >&2; exit 1; }
          fi
      - name: Processar fila de pedidos
        if: steps.window.outputs.run == 'true'
        env:
          SUPABASE_URL: https://ssbesxgaijknwsjbsbcz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
          BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
          BLING_REFRESH_TOKEN: ${{ secrets.BLING_REFRESH_TOKEN }}
          BLING_REFRESH_TOKEN_FILE: ${{ runner.temp }}/bling-refresh-token
          ORDER_LIMIT: ${{ github.event_name == 'schedule' && '10' || inputs.limit }}
          WORKER_ID: github-order-${{ github.run_id }}-${{ github.run_attempt }}
          BLING_ORDER_REPORT_FILE: ${{ runner.temp }}/bling-order-report.json
          BLING_REQUEST_INTERVAL_MS: '460'
          EFFECTIVE_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EFFECTIVE_MODE" = "apply" ]; then
            node scripts/bling-order-writer-v1.mjs --apply
          else
            node scripts/bling-order-writer-v1.mjs
          fi
      - name: Persistir refresh token rotacionado
        if: always() && steps.window.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.mode == 'apply')
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REFRESH_FILE: ${{ runner.temp }}/bling-refresh-token
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$REFRESH_FILE" ]; then
            test -n "$GH_TOKEN" || { echo 'Refresh token renovado, mas GH_SECRETS_TOKEN não está configurado.' >&2; exit 1; }
            gh secret set BLING_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat "$REFRESH_FILE")"
          fi
      - name: Resumo
        if: always()
        env:
          REPORT_FILE: ${{ runner.temp }}/bling-order-report.json
          EFFECTIVE_MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
        shell: bash
        run: |
          echo '### Pedidos → Bling' >> "$GITHUB_STEP_SUMMARY"
          echo "- Modo: \`$EFFECTIVE_MODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Regra: venda já confirmada ao cliente no WhatsApp; Bling é retaguarda assíncrona.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Agenda automática: a cada 10 minutos, 07:00–18:00 (America/Cuiaba).' >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$REPORT_FILE" ]; then
            node -e "const r=require(process.env.REPORT_FILE); for (const [k,v] of Object.entries(r)) console.log('- '+k+': `'+v+'`')" >> "$GITHUB_STEP_SUMMARY"
          fi
