name: Site do zero - segurança, sintaxe e geração

on:
  push:
    branches:
      - agent/site-do-zero-fase-1
    paths:
      - 'site-do-zero/**'
      - '.github/workflows/site-do-zero-readonly-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site-do-zero/**'
      - '.github/workflows/site-do-zero-readonly-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Baixar branch
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe das ferramentas e testes
        run: |
          node --check site-do-zero/build/gerar-seo-cestas.mjs
          node --check site-do-zero/build/diagnosticar-firebase.mjs
          node --check site-do-zero/build/preparar-importacao-site-novo.mjs
          node --check site-do-zero/build/preparar-mock-preview.mjs
          node --check site-do-zero/build/ajustar-saida-seo.mjs
          node --check site-do-zero/tests/validar-projeto.mjs

      - name: Bloquear métodos de escrita nas ferramentas
        shell: bash
        run: |
          set -euo pipefail
          if grep -En "method:[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]" \
            site-do-zero/build/gerar-seo-cestas.mjs \
            site-do-zero/build/diagnosticar-firebase.mjs \
            site-do-zero/build/preparar-importacao-site-novo.mjs \
            site-do-zero/build/preparar-mock-preview.mjs; then
            echo 'ERRO: método de escrita encontrado nas ferramentas de leitura.'
            exit 1
          fi

      - name: Confirmar método GET explícito
        shell: bash
        run: |
          set -euo pipefail
          grep -En "method:[[:space:]]*['\"]GET['\"]" site-do-zero/build/gerar-seo-cestas.mjs
          grep -En "method:[[:space:]]*['\"]GET['\"]" site-do-zero/build/diagnosticar-firebase.mjs
          grep -En "method:[[:space:]]*['\"]GET['\"]" site-do-zero/build/preparar-importacao-site-novo.mjs
          grep -En "method:[[:space:]]*['\"]GET['\"]" site-do-zero/build/preparar-mock-preview.mjs

      - name: Validar JavaScript interno do HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('site-do-zero/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('Nenhum JavaScript interno encontrado.')
          Path('/tmp/site-do-zero-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/site-do-zero-inline.js

      - name: Executar testes de regressão
        run: node site-do-zero/tests/validar-projeto.mjs

      - name: Confirmar proteção documentada
        shell: bash
        run: |
          test -f site-do-zero/FIREBASE-SOMENTE-LEITURA.md
          test -f site-do-zero/FIREBASE-NAMESPACE-NOVO.md
          test -f site-do-zero/build/README.md
          grep -q 'GET_ONLY' site-do-zero/build/gerar-seo-cestas.mjs

      - name: Diagnosticar caminhos do Firebase por GET
        run: node site-do-zero/build/diagnosticar-firebase.mjs

      - name: Preparar pacote isolado de importação
        run: node site-do-zero/build/preparar-importacao-site-novo.mjs

      - name: Preparar simulação local do namespace
        run: node site-do-zero/build/preparar-mock-preview.mjs

      - name: Gerar preview SEO e Merchant com o namespace simulado
        id: gerar
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory site-do-zero/importacao/mock >/tmp/site-novo-mock.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          FIREBASE_URL='http://127.0.0.1:8765' \
          FIREBASE_PRODUCTS_PATH='produtos' \
          FIREBASE_BASKETS_PATH='site_novo/publico/cestas' \
          OUTPUT_DIR='site-do-zero/generated' \
          node site-do-zero/build/gerar-seo-cestas.mjs
          OUTPUT_DIR='site-do-zero/generated' \
          node site-do-zero/build/ajustar-saida-seo.mjs

      - name: Publicar diagnóstico, importação, relatório e preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-do-zero-seo-preview
          path: |
            site-do-zero/diagnosticos
            site-do-zero/importacao/site-novo-publico.json
            site-do-zero/generated
          if-no-files-found: warn
          retention-days: 7

      - name: Exigir geração válida
        if: steps.gerar.outcome != 'success'
        shell: bash
        run: |
          echo 'A validação do namespace isolado não gerou páginas válidas.'
          if test -f site-do-zero/generated/relatorio.json; then
            cat site-do-zero/generated/relatorio.json
          fi
          exit 1

      - name: Validar arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          test -s site-do-zero/importacao/site-novo-publico.json
          test -s site-do-zero/generated/cestas/index.html
          test -s site-do-zero/generated/merchant.xml
          test -s site-do-zero/generated/sitemap.xml
          test -s site-do-zero/generated/robots.txt
          test -s site-do-zero/generated/relatorio.json
          grep -q '<g:product_type>Cestas básicas</g:product_type>' site-do-zero/generated/merchant.xml
          grep -q 'https://donaantonia.com.br/perguntas-frequentes.html' site-do-zero/generated/sitemap.xml
          if grep -Rqi 'shippingDetails' site-do-zero/generated/cestas; then
            echo 'ERRO: prazo de entrega não garantido permaneceu nos dados estruturados.'
            exit 1
          fi
          if grep -Eiq '<g:product_type>.*(kit|produto avulso)' site-do-zero/generated/merchant.xml; then
            echo 'ERRO: feed contém item fora de cestas básicas.'
            exit 1
          fi
