name: Stage 12 Label Recall Control Tower

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260908153000_stage12_label_recall_control_tower_v1.sql'
      - 'scripts/test-stage12-label-recall-control-tower-contract-v1.mjs'
      - 'scripts/test-stage12-label-recall-control-tower-db-v1.mjs'
      - 'docs/ETAPA-12-LABEL-RECALL-CONTROL-TOWER-V1.md'
      - '.github/workflows/stage12-label-recall-control-tower.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908153000_stage12_label_recall_control_tower_v1.sql'
      - 'scripts/test-stage12-label-recall-control-tower-contract-v1.mjs'
      - 'scripts/test-stage12-label-recall-control-tower-db-v1.mjs'
      - 'docs/ETAPA-12-LABEL-RECALL-CONTROL-TOWER-V1.md'
      - '.github/workflows/stage12-label-recall-control-tower.yml'
permissions:
  contents: read
jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            supabase/migrations/20260908153000_stage12_label_recall_control_tower_v1.sql
            scripts/test-stage12-label-recall-control-tower-contract-v1.mjs
            scripts/test-stage12-label-recall-control-tower-db-v1.mjs
            docs/ETAPA-12-LABEL-RECALL-CONTROL-TOWER-V1.md
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/stage12-control-tower" --no-save @electric-sql/pglite@0.5.8
      - name: Contrato estático
        run: node scripts/test-stage12-label-recall-control-tower-contract-v1.mjs
      - name: Labels + Recall + Control Tower + SLA em PostgreSQL isolado
        env:
          TEST_RUNTIME: ${{ runner.temp }}/stage12-control-tower
        run: node scripts/test-stage12-label-recall-control-tower-db-v1.mjs
