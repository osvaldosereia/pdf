name: CanecaFacil Chat V1 Tests

on:
  pull_request:
    paths:
      - 'loja-integrada/personalizar/**'
      - 'scripts/test-canecafacil-chat-v1.mjs'
      - '.github/workflows/canecafacil-chat-v1-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check loja-integrada/personalizar/chat-v1.js
      - name: Conversation contract smoke test
        run: node scripts/test-canecafacil-chat-v1.mjs
