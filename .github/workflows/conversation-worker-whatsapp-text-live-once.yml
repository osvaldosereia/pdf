name: Dona Antonia - WhatsApp text AI live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conversation-worker-whatsapp-text-live-once.yml'

permissions:
  contents: read

concurrency:
  group: dona-antonia-conversation-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_JOB_ID: e31ce832-e780-4888-8681-a84bc4c61b1c
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CONVERSATION_MODEL: ${{ vars.OPENAI_CONVERSATION_MODEL }}
      OPENAI_TRANSCRIPTION_MODEL: ${{ vars.OPENAI_TRANSCRIPTION_MODEL }}
      AI_JOB_LIMIT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify exact pending job before provider spend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EXPECTED_JOB_ID}=process.env;
          if(!SUPABASE_URL||!SUPABASE_SERVICE_ROLE_KEY||!EXPECTED_JOB_ID) throw new Error('missing_required_environment');
          const r=await fetch(`${SUPABASE_URL}/rest/v1/ai_jobs?status=eq.pending&select=id,message_id,job_type,status&order=created_at.asc`,{
            headers:{apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`},
            signal:AbortSignal.timeout(20000),redirect:'error'
          });
          if(!r.ok) throw new Error(`preflight_http_${r.status}`);
          const jobs=await r.json();
          if(jobs.length!==1) throw new Error(`unexpected_pending_count_${jobs.length}`);
          if(jobs[0].id!==EXPECTED_JOB_ID) throw new Error('unexpected_pending_job');
          if(jobs[0].job_type!=='conversation') throw new Error('unexpected_job_type');
          console.log(JSON.stringify({preflight:'ok',job_id:jobs[0].id,job_type:jobs[0].job_type}));
          NODE
      - name: Run worker tests
        run: node --test scripts/conversation-worker-v1.test.mjs scripts/whatsapp-bridge-v1.test.mjs
      - name: Process exactly one queued job
        run: node scripts/conversation-worker-v1.mjs --apply
      - name: Verify exact job completed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const {SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EXPECTED_JOB_ID}=process.env;
          const r=await fetch(`${SUPABASE_URL}/rest/v1/ai_jobs?id=eq.${EXPECTED_JOB_ID}&select=id,status,attempts,error_message`,{
            headers:{apikey:SUPABASE_SERVICE_ROLE_KEY,Authorization:`Bearer ${SUPABASE_SERVICE_ROLE_KEY}`},
            signal:AbortSignal.timeout(20000),redirect:'error'
          });
          if(!r.ok) throw new Error(`postflight_http_${r.status}`);
          const jobs=await r.json();
          if(jobs.length!==1||jobs[0].status!=='done') throw new Error('expected_job_not_done');
          console.log(JSON.stringify({postflight:'ok',job_id:jobs[0].id,status:jobs[0].status,attempts:jobs[0].attempts}));
          NODE
