name: Stage 12 Commercial Truth

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260908120000_stage12_commercial_truth_foundation_v1.sql'
      - 'supabase/migrations/20260908120100_stage12_fefo_margin_guard_v1.sql'
      - 'supabase/migrations/20260908120200_stage12_promotions_benefits_v1.sql'
      - 'supabase/migrations/20260908120300_stage12_reports_recommendations_v1.sql'
      - 'supabase/migrations/20260908120400_stage12_lot_truth_fail_closed_v2.sql'
      - 'supabase/migrations/20260908120500_stage12_fefo_expiry_idempotency_v3.sql'
      - 'supabase/migrations/20260908120600_stage12_reservation_idempotency_fix_v4.sql'
      - 'supabase/functions/admin-commercial-truth-v1/**'
      - 'supabase/config.toml'
      - 'admin-v3/commercial-truth.js'
      - 'admin-v3/commercial-truth.css'
      - 'admin/index.html'
      - 'admin/config.js'
      - 'scripts/test-commercial-truth-stage12-v1.mjs'
      - 'scripts/test-commercial-truth-stage12-hardening-v2.mjs'
      - 'scripts/test-commercial-truth-stage12-db-v1.mjs'
      - '.github/workflows/processar-ofertas.yml'
      - 'docs/ETAPA-12-VERDADE-COMERCIAL-V1.md'
      - '.github/workflows/stage12-commercial-truth.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908120000_stage12_commercial_truth_foundation_v1.sql'
      - 'supabase/migrations/20260908120100_stage12_fefo_margin_guard_v1.sql'
      - 'supabase/migrations/20260908120200_stage12_promotions_benefits_v1.sql'
      - 'supabase/migrations/20260908120300_stage12_reports_recommendations_v1.sql'
      - 'supabase/migrations/20260908120400_stage12_lot_truth_fail_closed_v2.sql'
      - 'supabase/migrations/20260908120500_stage12_fefo_expiry_idempotency_v3.sql'
      - 'supabase/migrations/20260908120600_stage12_reservation_idempotency_fix_v4.sql'
      - 'supabase/functions/admin-commercial-truth-v1/**'
      - 'supabase/config.toml'
      - 'admin-v3/commercial-truth.js'
      - 'admin-v3/commercial-truth.css'
      - 'admin/index.html'
      - 'admin/config.js'
      - 'scripts/test-commercial-truth-stage12-v1.mjs'
      - 'scripts/test-commercial-truth-stage12-hardening-v2.mjs'
      - 'scripts/test-commercial-truth-stage12-db-v1.mjs'
      - '.github/workflows/processar-ofertas.yml'
      - 'docs/ETAPA-12-VERDADE-COMERCIAL-V1.md'
      - '.github/workflows/stage12-commercial-truth.yml'

permissions:
  contents: read

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Instalar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/stage12" --no-save @electric-sql/pglite@0.5.8
      - name: Validar contratos de segurança
        run: node scripts/test-commercial-truth-stage12-v1.mjs
      - name: Validar hardening FEFO/margem
        run: node scripts/test-commercial-truth-stage12-hardening-v2.mjs
      - name: Aplicar migrations e testar comportamento
        env:
          TEST_RUNTIME: ${{ runner.temp }}/stage12
        run: node scripts/test-commercial-truth-stage12-db-v1.mjs
      - name: Verificar JavaScript do Admin
        run: node --check admin-v3/commercial-truth.js
      - name: Deno check da API comercial
        run: deno check supabase/functions/admin-commercial-truth-v1/index.ts
