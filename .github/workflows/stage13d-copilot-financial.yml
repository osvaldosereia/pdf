name: Stage 13D Copilot Financial

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260908193000_human_copilot_backend_v1.sql'
      - 'supabase/migrations/20260908194000_stage13_financial_reconciliation_v1.sql'
      - 'supabase/functions/admin-human-copilot-v1/**'
      - 'supabase/functions/admin-financial-v1/**'
      - 'admin/config.js'
      - 'admin-v3/human-copilot-panel.js'
      - 'admin-v3/financial-admin.js'
      - 'admin-v3/financial-admin.css'
      - 'scripts/test-stage13d-copilot-financial-contract-v1.mjs'
      - 'scripts/test-stage13d-copilot-financial-db-v1.mjs'
      - 'docs/ETAPA-13D-COPILOTO-CONCILIACAO-V1.md'
      - '.github/workflows/stage13d-copilot-financial.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260908193000_human_copilot_backend_v1.sql'
      - 'supabase/migrations/20260908194000_stage13_financial_reconciliation_v1.sql'
      - 'supabase/functions/admin-human-copilot-v1/**'
      - 'supabase/functions/admin-financial-v1/**'
      - 'admin/config.js'
      - 'admin-v3/human-copilot-panel.js'
      - 'admin-v3/financial-admin.js'
      - 'admin-v3/financial-admin.css'
      - 'scripts/test-stage13d-copilot-financial-contract-v1.mjs'
      - 'scripts/test-stage13d-copilot-financial-db-v1.mjs'
      - 'docs/ETAPA-13D-COPILOTO-CONCILIACAO-V1.md'
      - '.github/workflows/stage13d-copilot-financial.yml'

permissions:
  contents: read

jobs:
  stage13d:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            supabase/migrations/20260908193000_human_copilot_backend_v1.sql
            supabase/migrations/20260908194000_stage13_financial_reconciliation_v1.sql
            supabase/functions/admin-human-copilot-v1/index.ts
            supabase/functions/admin-financial-v1/index.ts
            admin/config.js
            admin-v3/human-copilot-panel.js
            admin-v3/financial-admin.js
            admin-v3/financial-admin.css
            scripts/test-stage13d-copilot-financial-contract-v1.mjs
            scripts/test-stage13d-copilot-financial-db-v1.mjs
            docs/ETAPA-13D-COPILOTO-CONCILIACAO-V1.md
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar PostgreSQL isolado
        run: npm install --prefix "$RUNNER_TEMP/stage13d" --no-save @electric-sql/pglite@0.5.8
      - name: Contratos estáticos
        run: node scripts/test-stage13d-copilot-financial-contract-v1.mjs
      - name: Banco isolado
        env:
          TEST_RUNTIME: ${{ runner.temp }}/stage13d
        run: node scripts/test-stage13d-copilot-financial-db-v1.mjs
      - name: Validar JavaScript Admin
        run: |
          node --check admin/config.js
          node --check admin-v3/human-copilot-panel.js
          node --check admin-v3/financial-admin.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validar Edge Functions
        run: deno check supabase/functions/admin-human-copilot-v1/index.ts supabase/functions/admin-financial-v1/index.ts
